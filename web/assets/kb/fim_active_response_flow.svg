<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" width="100%" height="auto">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111c33"/>
    </linearGradient>
    <marker id="arr7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
  </defs>
  <rect width="820" height="290" rx="14" fill="url(#bg7)" stroke="#1e293b" stroke-width="2"/>
  <text x="24" y="34" fill="#10b981" font-family="sans-serif" font-size="15" font-weight="bold">CƠ CHẾ FIM (GIÁM SÁT FILE) &amp; ACTIVE RESPONSE (TỰ ĐỘNG CHẶN IP)</text>

  <!-- Left: FIM -->
  <rect x="24" y="56" width="376" height="210" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.8"/>
  <text x="42" y="82" fill="#10b981" font-family="sans-serif" font-size="13" font-weight="bold">🛡️ 1. FIM - FILE INTEGRITY MONITORING</text>
  <rect x="40" y="96" width="344" height="46" rx="6" fill="#1e293b"/>
  <text x="52" y="114" fill="#6ee7b7" font-family="monospace" font-size="11" font-weight="bold">realtime="yes" (Inotify / WinAPI)</text>
  <text x="52" y="132" fill="#cbd5e1" font-family="sans-serif" font-size="10">Phát hiện ngay lập tức khi file bị thêm, sửa, xóa (Rule 550, 554, 553)</text>
  <rect x="40" y="150" width="344" height="46" rx="6" fill="#1e293b"/>
  <text x="52" y="168" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">whodata="yes" (Linux Auditd / Windows SACL)</text>
  <text x="52" y="186" fill="#cbd5e1" font-family="sans-serif" font-size="10">Chỉ rõ Tài khoản (User) nào &amp; Tiến trình (Process) nào vừa sửa file</text>
  <rect x="40" y="204" width="344" height="46" rx="6" fill="#1e293b"/>
  <text x="52" y="222" fill="#fcd34d" font-family="monospace" font-size="11" font-weight="bold">report_changes="yes"</text>
  <text x="52" y="240" fill="#cbd5e1" font-family="sans-serif" font-size="10">Hiển thị chi tiết dòng chữ nào trong file cấu hình vừa bị thay đổi</text>

  <!-- Right: Active Response -->
  <rect x="420" y="56" width="376" height="210" rx="10" fill="#0f172a" stroke="#f43f5e" stroke-width="1.8"/>
  <text x="438" y="82" fill="#f43f5e" font-family="sans-serif" font-size="13" font-weight="bold">⚡ 2. ACTIVE RESPONSE (TỰ ĐỘNG PHẢN ỨNG)</text>
  <rect x="436" y="96" width="344" height="46" rx="6" fill="#1e293b"/>
  <text x="448" y="114" fill="#fda4af" font-family="sans-serif" font-size="11" font-weight="bold">Bước 1: Kẻ tấn công kích hoạt Rule nguy hiểm</text>
  <text x="448" y="132" fill="#cbd5e1" font-family="sans-serif" font-size="10">VD: Rule 5712 / 100105 (SSH Brute Force) hoặc SQL Injection</text>
  <rect x="436" y="150" width="344" height="46" rx="6" fill="#1e293b"/>
  <text x="448" y="168" fill="#fcd34d" font-family="sans-serif" font-size="11" font-weight="bold">Bước 2: Wazuh Manager phát lệnh xuống Agent</text>
  <text x="448" y="186" fill="#cbd5e1" font-family="monospace" font-size="10">Kịch bản: firewall-drop / iptables / netsh / route-null</text>
  <rect x="436" y="204" width="344" height="46" rx="6" fill="#4c0519"/>
  <text x="448" y="222" fill="#fecdd3" font-family="sans-serif" font-size="11" font-weight="bold">Bước 3: Khóa cứng IP tấn công &amp; Tự mở sau Timeout</text>
  <text x="448" y="240" fill="#fda4af" font-family="monospace" font-size="10">Log ghi tại: /var/ossec/logs/active-responses.log</text>
</svg>
