<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" width="100%" height="auto">
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111c33"/>
    </linearGradient>
  </defs>
  <rect width="820" height="290" rx="14" fill="url(#bg8)" stroke="#1e293b" stroke-width="2"/>
  <text x="24" y="34" fill="#a855f7" font-family="sans-serif" font-size="15" font-weight="bold">BẢNG TRA CỨU NHANH WAZUH REST API (55000) &amp; OPENSEARCH INDEXER (9200)</text>

  <!-- Col 1: REST API 55000 -->
  <rect x="24" y="56" width="376" height="210" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="42" y="82" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">🔑 1. WAZUH MANAGER REST API (PORT 55000)</text>
  <rect x="40" y="96" width="344" height="46" rx="6" fill="#1e293b"/>
  <text x="52" y="114" fill="#7dd3fc" font-family="monospace" font-size="10.5" font-weight="bold">POST /security/user/authenticate</text>
  <text x="52" y="132" fill="#cbd5e1" font-family="sans-serif" font-size="10">Lấy JWT Token (hiệu lực 900s) bằng tài khoản wazuh</text>
  <rect x="40" y="150" width="344" height="46" rx="6" fill="#1e293b"/>
  <text x="52" y="168" fill="#6ee7b7" font-family="monospace" font-size="10.5" font-weight="bold">GET /agents?limit=500 &amp; GET /manager/status</text>
  <text x="52" y="186" fill="#cbd5e1" font-family="sans-serif" font-size="10">Lấy danh sách máy trạm Agent (Active/Disconnected) &amp; Daemons</text>
  <rect x="40" y="204" width="344" height="46" rx="6" fill="#1e293b"/>
  <text x="52" y="222" fill="#fcd34d" font-family="monospace" font-size="10.5" font-weight="bold">GET /rules?rule_ids=5710 &amp; PUT /active-response</text>
  <text x="52" y="240" fill="#cbd5e1" font-family="sans-serif" font-size="10">Tra cứu chi tiết Rule gốc &amp; Phát lệnh chặn IP từ xa</text>

  <!-- Col 2: OpenSearch 9200 -->
  <rect x="420" y="56" width="376" height="210" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.8"/>
  <text x="438" y="82" fill="#a855f7" font-family="sans-serif" font-size="13" font-weight="bold">🔍 2. WAZUH INDEXER / OPENSEARCH (PORT 9200)</text>
  <rect x="436" y="96" width="344" height="46" rx="6" fill="#1e293b"/>
  <text x="448" y="114" fill="#e9d5ff" font-family="monospace" font-size="10.5" font-weight="bold">GET /wazuh-alerts-4.x-*/_search</text>
  <text x="448" y="132" fill="#cbd5e1" font-family="sans-serif" font-size="10">Truy vấn cảnh báo theo thời gian, rule.level, data.srcip</text>
  <rect x="436" y="150" width="344" height="46" rx="6" fill="#1e293b"/>
  <text x="448" y="168" fill="#f472b6" font-family="monospace" font-size="10.5" font-weight="bold">GET /_cat/indices/wazuh-alerts-*?v&amp;s=index</text>
  <text x="448" y="186" fill="#cbd5e1" font-family="sans-serif" font-size="10">Kiểm tra dung lượng các chỉ mục lưu trữ cảnh báo theo ngày</text>
  <rect x="436" y="204" width="344" height="46" rx="6" fill="#1e293b"/>
  <text x="448" y="222" fill="#fda4af" font-family="monospace" font-size="10.5" font-weight="bold">DELETE /wazuh-alerts-4.x-2026.08.*</text>
  <text x="448" y="240" fill="#cbd5e1" font-family="sans-serif" font-size="10">Xóa các chỉ mục log cũ khi ổ cứng máy chủ bị đầy (&gt;85%)</text>
</svg>
