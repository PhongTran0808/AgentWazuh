<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" width="100%" height="auto">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111c33"/>
    </linearGradient>
    <marker id="arr6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="820" height="290" rx="14" fill="url(#bg6)" stroke="#1e293b" stroke-width="2"/>
  <text x="24" y="34" fill="#38bdf8" font-family="sans-serif" font-size="15" font-weight="bold">QUY TRÌNH 3 PHA PHÂN TÍCH LOG TRONG WAZUH (WAZUH-LOGTEST)</text>

  <!-- Phase 1 -->
  <rect x="24" y="56" width="235" height="208" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="40" y="84" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">PHA 1: PRE-DECODING</text>
  <text x="40" y="108" fill="#cbd5e1" font-family="sans-serif" font-size="10">Tách thông tin tiêu đề chuẩn Syslog:</text>
  <rect x="38" y="120" width="206" height="68" rx="6" fill="#1e293b"/>
  <text x="48" y="140" fill="#7dd3fc" font-family="monospace" font-size="10">• timestamp (Thời gian)</text>
  <text x="48" y="158" fill="#7dd3fc" font-family="monospace" font-size="10">• hostname (Tên máy gửi)</text>
  <text x="48" y="176" fill="#7dd3fc" font-family="monospace" font-size="10">• program_name (예: sshd)</text>
  <text x="40" y="214" fill="#94a3b8" font-family="sans-serif" font-size="10">Giữ lại phần nội dung log chính</text>
  <text x="40" y="232" fill="#94a3b8" font-family="sans-serif" font-size="10">để chuyển sang Pha 2.</text>

  <line x1="259" y1="160" x2="291" y2="160" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr6)"/>

  <!-- Phase 2 -->
  <rect x="295" y="56" width="235" height="208" rx="10" fill="#0f172a" stroke="#c084fc" stroke-width="1.8"/>
  <text x="311" y="84" fill="#c084fc" font-family="sans-serif" font-size="13" font-weight="bold">PHA 2: DECODING (TÁCH TRƯỜNG)</text>
  <text x="311" y="108" fill="#cbd5e1" font-family="sans-serif" font-size="10">Khớp với Decoder XML / JSON:</text>
  <rect x="309" y="120" width="206" height="68" rx="6" fill="#1e293b"/>
  <text x="319" y="140" fill="#e9d5ff" font-family="monospace" font-size="10">• srcip: 10.10.20.10</text>
  <text x="319" y="158" fill="#e9d5ff" font-family="monospace" font-size="10">• dstuser: root / admin</text>
  <text x="319" y="176" fill="#e9d5ff" font-family="monospace" font-size="10">• srcport / action / url</text>
  <text x="311" y="214" fill="#94a3b8" font-family="monospace" font-size="9.5">/var/ossec/etc/decoders/</text>
  <text x="311" y="232" fill="#c084fc" font-family="monospace" font-size="10">local_decoder.xml</text>

  <line x1="530" y1="160" x2="562" y2="160" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr6)"/>

  <!-- Phase 3 -->
  <rect x="566" y="56" width="230" height="208" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.8"/>
  <text x="582" y="84" fill="#10b981" font-family="sans-serif" font-size="13" font-weight="bold">PHA 3: RULE MATCHING</text>
  <text x="582" y="108" fill="#cbd5e1" font-family="sans-serif" font-size="10">So khớp cây Luật (Rules XML):</text>
  <rect x="580" y="120" width="202" height="68" rx="6" fill="#1e293b"/>
  <text x="590" y="140" fill="#6ee7b7" font-family="monospace" font-size="10">• Rule Đơn: &lt;if_sid&gt;</text>
  <text x="590" y="158" fill="#fcd34d" font-family="monospace" font-size="10">• Tần suất: &lt;if_matched_sid&gt;</text>
  <text x="590" y="176" fill="#f472b6" font-family="monospace" font-size="10">• Gán Level (0 ➔ 16) &amp; MITRE</text>
  <text x="582" y="214" fill="#94a3b8" font-family="monospace" font-size="9.5">/var/ossec/etc/rules/</text>
  <text x="582" y="232" fill="#10b981" font-family="monospace" font-size="10">local_rules.xml (ID 100000+)</text>
</svg>
