<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" width="100%" height="auto">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111c33"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="820" height="320" rx="14" fill="url(#bg)" stroke="#1e293b" stroke-width="2"/>
  <text x="24" y="34" fill="#38bdf8" font-family="sans-serif" font-size="15" font-weight="bold">SƠ ĐỒ KIẾN TRÚC &amp; CỔNG KẾT NỐI WAZUH SIEM</text>

  <!-- Box 1: Endpoints -->
  <rect x="24" y="64" width="190" height="220" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.8"/>
  <text x="119" y="92" fill="#10b981" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">1. THIẾT BỊ GIÁM SÁT</text>
  <rect x="40" y="108" width="158" height="46" rx="6" fill="#1e293b"/>
  <text x="119" y="128" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Wazuh Agent</text>
  <text x="119" y="144" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Linux / Windows / macOS</text>
  <rect x="40" y="168" width="158" height="46" rx="6" fill="#1e293b"/>
  <text x="119" y="188" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Tường Lửa / Router</text>
  <text x="119" y="204" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">FortiGate / Cisco (Syslog)</text>
  <text x="119" y="252" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">Gửi Log thời gian thực</text>

  <!-- Arrows 1 -> 2 -->
  <line x1="214" y1="122" x2="306" y2="122" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="260" y="114" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">TCP 1514 (Log)</text>
  <line x1="214" y1="154" x2="306" y2="154" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="260" y="146" fill="#f59e0b" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">TCP 1515 (ĐKý)</text>
  <line x1="214" y1="192" x2="306" y2="192" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="260" y="184" fill="#10b981" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">UDP 514 (Syslog)</text>

  <!-- Box 2: Wazuh Manager -->
  <rect x="310" y="64" width="215" height="220" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="417" y="92" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">2. WAZUH SERVER</text>
  <rect x="326" y="108" width="183" height="42" rx="6" fill="#1e293b"/>
  <text x="417" y="126" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">wazuh-remoted &amp; analysisd</text>
  <text x="417" y="142" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Giải mã Log &amp; So khớp Rule XML</text>
  <rect x="326" y="160" width="183" height="42" rx="6" fill="#1e293b"/>
  <text x="417" y="178" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Filebeat + Wazuh API</text>
  <text x="417" y="194" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">REST API: Port 55000</text>
  <rect x="326" y="212" width="183" height="54" rx="6" fill="#172554"/>
  <text x="417" y="232" fill="#93c5fd" font-family="monospace" font-size="10" text-anchor="middle">/var/ossec/logs/alerts/</text>
  <text x="417" y="250" fill="#93c5fd" font-family="monospace" font-size="10" text-anchor="middle">alerts.json &amp; ossec.log</text>

  <!-- Arrows 2 -> 3 -->
  <line x1="525" y1="145" x2="605" y2="145" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="565" y="136" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">TCP 9200</text>
  <line x1="525" y1="200" x2="605" y2="200" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="565" y="191" fill="#a855f7" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">API 55000</text>

  <!-- Box 3: Indexer & Dashboard -->
  <rect x="610" y="64" width="186" height="220" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.8"/>
  <text x="703" y="92" fill="#a855f7" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">3. LƯU TRỮ &amp; SOC</text>
  <rect x="624" y="108" width="158" height="50" rx="6" fill="#1e293b"/>
  <text x="703" y="128" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Wazuh Indexer</text>
  <text x="703" y="145" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">OpenSearch (Port 9200)</text>
  <rect x="624" y="168" width="158" height="50" rx="6" fill="#1e293b"/>
  <text x="703" y="188" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Wazuh Dashboard</text>
  <text x="703" y="205" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Web UI (HTTPS 443)</text>
  <rect x="624" y="226" width="158" height="44" rx="6" fill="#3b0764"/>
  <text x="703" y="246" fill="#e9d5ff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">AgentWazuh AI</text>
  <text x="703" y="261" fill="#d8b4fe" font-family="monospace" font-size="10" text-anchor="middle">Port 8080 (Trợ lý SOC)</text>
</svg>
