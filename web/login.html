<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentWazuh — SOC Master Portal Login</title>
    <link rel="stylesheet" href="/static/design-tokens.css">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="login-body-v2">

    <!-- Cyberpunk Animated Grid & Ambient Lights Background -->
    <div class="cyber-bg-overlay">
        <div class="ambient-glow glow-cyan"></div>
        <div class="ambient-glow glow-emerald"></div>
        <div class="grid-lines"></div>
    </div>

    <!-- Center Login Glassmorphism Card -->
    <main class="login-card-container">
        
        <!-- Header Shield Branding -->
        <div class="login-brand-header">
            <div class="logo-shield-wrapper">
                <i class="fa-solid fa-shield-halved logo-shield-icon"></i>
                <div class="pulse-ring"></div>
            </div>
            <h1 class="login-title">AgentWazuh <span class="accent-text">SOC Portal</span></h1>
            <p class="login-subtitle">Hệ Thống Trợ Lý AI Giám Sát & Điều Tra Sự Cố An Ninh Mạng</p>
        </div>

        <!-- Live Status Badges -->
        <div class="login-status-pills">
            <span class="status-pill pill-online"><i class="fa-solid fa-network-wired"></i> Dynamic Wazuh Host IP Selector</span>
            <span class="status-pill pill-secure"><i class="fa-solid fa-lock"></i> Enterprise Admin Auth</span>
        </div>

        <!-- Login Form with Wazuh IP Field -->
        <form id="login-form-v2" class="login-form-body">
            <div id="login-error-msg" class="login-error-alert hidden">
                <i class="fa-solid fa-circle-exclamation"></i> <span id="error-text">Tên đăng nhập hoặc mật khẩu không chính xác.</span>
            </div>

            <!-- Wazuh Manager IP & Port Inputs -->
            <div class="input-group-v2">
                <label for="wazuh_host"><i class="fa-solid fa-server"></i> Địa Chỉ IP Máy Chủ Wazuh Manager & Port REST API</label>
                <div style="display: flex; gap: 0.5rem;">
                    <div class="input-field-wrapper" style="flex: 1;">
                        <i class="fa-solid fa-globe field-icon"></i>
                        <input type="text" id="wazuh_host" name="wazuh_host" placeholder="Ví dụ: 192.168.1.10 hoặc IP máy chủ của bạn" value="" required>
                    </div>
                    <div class="input-field-wrapper" style="width: 140px; flex-shrink: 0;">
                        <i class="fa-solid fa-plug field-icon"></i>
                        <input type="number" id="wazuh_port" name="wazuh_port" placeholder="55000" value="55000" required>
                    </div>
                </div>
            </div>

            <!-- Admin Username Input -->
            <div class="input-group-v2">
                <label for="username"><i class="fa-solid fa-user-shield"></i> Tên Đăng Nhập Admin</label>
                <div class="input-field-wrapper">
                    <i class="fa-solid fa-user field-icon"></i>
                    <input type="text" id="username" name="username" placeholder="Nhập admin..." value="admin" required autocomplete="username">
                </div>
            </div>

            <!-- Admin Password Input -->
            <div class="input-group-v2">
                <label for="password"><i class="fa-solid fa-key"></i> Mật Khẩu Khóa Bảo Mật</label>
                <div class="input-field-wrapper">
                    <i class="fa-solid fa-lock field-icon"></i>
                    <input type="password" id="password" name="password" placeholder="••••••••" value="admin123" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" id="btn-submit-login" class="btn-cyber-submit">
                <span><i class="fa-solid fa-right-to-bracket"></i> Đăng Nhập Hệ Thống SOC</span>
                <i class="fa-solid fa-arrow-right arrow-icon"></i>
            </button>
        </form>

        <!-- Footer Meta -->
        <footer class="login-card-footer">
            <span><i class="fa-solid fa-clock-rotate-left"></i> Inactivity Session Expiry: <strong>30 Phút</strong></span>
            <span><i class="fa-solid fa-shield-check"></i> Hỗ trợ kết nối động tới mọi địa chỉ IP Wazuh Manager Server</span>
        </footer>

    </main>

    <script src="/static/login.js"></script>
</body>
</html>
